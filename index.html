<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação do PCA - Fundação Florestal</title>
<style>
/* Identidade Fundação Florestal — fundo claro. Para trocar as cores, altere só estas variáveis. */
:root{color-scheme:light;--bg:#f7f6f1;--card:#fffefb;--tx:#22302a;--mut:#667068;--bd:#e1e3d8;--ac:#1d6b3f;--ac-d:#14502e;--ac2:#e9f1e3;--sol:#d9a21b;--crit:#b3261e;--med:#a86100;--baixa:#506384;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif}

h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.2px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;padding:16px 20px;border-radius:14px;background:linear-gradient(135deg,var(--ac-d),var(--ac));color:#fff;border-bottom:4px solid var(--sol);box-shadow:0 2px 8px rgba(20,80,46,.15)}
header .sub,header label{color:#e3efe0}header select{background:#fff;color:var(--tx);border-color:#fff}

nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:14px}

nav button:hover{color:var(--ac)}nav button.on{color:var(--ac-d);border-color:var(--sol);border-bottom-width:3px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.c b{display:block;font-size:21px;overflow-wrap:anywhere}.c span{color:var(--mut);font-size:12px}

<div class="w" id="app"></div>
<dialog id="dlg"></dialog>
<script>
const Core = (() => {
  const COLS = ['num','status','situacao','titulo','categoria','uasg','ini','fim','prazo','area','dfd','prioridade','item_dfd','conclusao_dfd','classificacao','cod_grupo','nome_grupo','cod_pdm','nome_pdm','cod_item','desc_item','unid','vunit','qtd','vtotal'];
  function decode(buf) {
    try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }
  }
  function parseCSV(t, sep = ';') {
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    const rows = []; let row = [], f = '', q = false, start = true;
    const end = c => c === undefined || c === sep || c === '\n' || c === '\r';
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c === '"') {
          if (t[i+1] === '"') { f += '"'; i++; }
          else if (end(t[i+1])) q = false;
          else f += '"';
        } else f += c;
      }
      else if (c === '"' && start) { q = true; start = false; }
      else if (c === sep) { row.push(f); f = ''; start = true; }
      else if (c === '\n') { row.push(f.replace(/\r$/, '')); rows.push(row); row = []; f = ''; start = true; }
      else { f += c; start = false; }
    }
    if (f || row.length) { row.push(f.replace(/\r$/, '')); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim() !== ''));
  }
  const num = s => { s = (s || '').trim(); if (!s) return null; const v = parseFloat(s.replace(/\./g, '').replace(',', '.')); return isNaN(v) ? null : v; };
  const decs = s => { const m = (s || '').trim().match(/,(\d+)$/); return m ? m[1].length : 0; };
  function pdate(s) {
    const m = (s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    const d = new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    return d.getUTCDate() === +m[1] ? d : null;
  }
  const fdate = d => d ? String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + d.getUTCFullYear() : '';
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const slug = s => String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const STOP = new Set(['de','da','do','das','dos','para','e','a','o','em','por','com','no','na','ff','pca']);
  const toks = s => new Set(norm(s).split(' ').filter(w => w.length > 2 && !STOP.has(w)));
  function jacc(a, b) { let i = 0; a.forEach(x => { if (b.has(x)) i++; }); const u = a.size + b.size - i; return u ? i / u : 0; }

  function load(buf, ano) {
    const text = typeof buf === 'string' ? buf : decode(buf);
    const all = parseCSV(text);
    const body = all.slice(1);
    const items = body.map((r, i) => { const o = {_l: i + 2}; COLS.forEach((c, k) => o[c] = (r[k] || '').trim()); o.vunit_n = num(o.vunit); o.qtd_n = num(o.qtd); o.vtotal_n = num(o.vtotal); return o; });
    const map = new Map();
    items.forEach(it => {
      let c = map.get(it.num);
      if (!c) { c = {num: it.num, ano, id: ano + '-' + slug(it.num), titulo: it.titulo, status: it.status, categoria: it.categoria, area: it.area, prioridade: it.prioridade, uasg: it.uasg, ini: it.ini, fim: it.fim, prazo: it.prazo, itens: [], dfds: new Set(), total: 0, linhas: []}; map.set(it.num, c); }
      c.itens.push(it); c.dfds.add(it.dfd); c.total += it.vtotal_n || 0; c.linhas.push(it._l);
    });
    const cs = [...map.values()].map(c => ({...c, dfds: [...c.dfds]}));
    return {ano, items, cs, text};
  }

  const REGRAS = {
    R01: ['crit', 'Número da contratação inválido (esperado N/AAAA)'],
    R02: ['crit', 'Data de início ou conclusão ausente/inválida'],
    R03: ['crit', 'Conclusão anterior ao início'],
    R04: ['med', 'Prazo informado diverge de (conclusão − início)'],
    R05: ['med', 'Datas fora do exercício do PCA'],
    R06: ['crit', 'Valor total diverge de valor unitário × quantidade'],
    R07: ['med', 'Valor com separador/casas decimais anômalos'],
    R08: ['med', 'Item sem código CATMAT/CATSER'],
    R09: ['baixa', 'Título curto demais ou duplicado'],
    R10: ['med', 'DFD misturando bens e serviços'],
    R11: ['baixa', 'Concentração de conclusões na mesma data'],
    R12: ['med', 'Categoria da contratação incoerente com os itens'],
    R13: ['med', 'Área requisitante ou prioridade em branco'],
    R14: ['crit', 'Valor total zero, negativo ou ausente'],
    R15: ['med', 'Item de DFD repetido em contratações diferentes']
  };

  function validar(ds) {
    const out = []; const ano = ds.ano;
    const add = (c, r, det, ref) => out.push({id: c.id + '|' + r, cid: c.id, num: c.num, regra: r, sev: REGRAS[r][0], desc: REGRAS[r][1], det, ref: ref || ''});
    const fimCount = {}; ds.cs.forEach(c => { fimCount[c.fim] = (fimCount[c.fim] || 0) + 1; });
    const titCount = {}; ds.cs.forEach(c => { const k = norm(c.titulo); titCount[k] = (titCount[k] || 0) + 1; });
    const dfdItem = {}; ds.items.forEach(it => { if (it.dfd && it.item_dfd) (dfdItem[it.dfd + '#' + it.item_dfd] ||= new Set()).add(it.num); });
    const dfdCls = {}; ds.items.forEach(it => { if (it.dfd) (dfdCls[it.dfd] ||= new Set()).add(it.classificacao); });
    const thr = Math.max(8, Math.ceil(ds.cs.length * 0.15));
    ds.cs.forEach(c => {
      const ref = 'linha(s) ' + c.linhas.slice(0, 4).join(', ') + (c.linhas.length > 4 ? '…' : '');
      if (!/^\d{1,4}\/\d{4}$/.test(c.num)) add(c, 'R01', 'Valor lido: "' + c.num + '"', ref);
      const di = pdate(c.ini), df = pdate(c.fim);
      if (!di || !df) add(c, 'R02', 'Início "' + c.ini + '" · conclusão "' + c.fim + '"', ref);
      else {
        if (df < di) add(c, 'R03', fdate(di) + ' → ' + fdate(df), ref);
        const dd = Math.round((df - di) / 864e5), pz = parseInt(c.prazo, 10);
        if (isNaN(pz) || Math.abs(dd - pz) > 3) add(c, 'R04', 'Prazo informado ' + (c.prazo || '—') + ' d · calculado ' + dd + ' d', ref);
        if (di.getUTCFullYear() < ano - 1 || df.getUTCFullYear() > ano + 1 || df.getUTCFullYear() < ano) add(c, 'R05', fdate(di) + ' → ' + fdate(df) + ' (PCA ' + ano + ')', ref);
        if (fimCount[c.fim] >= thr) add(c, 'R11', fimCount[c.fim] + ' contratações concluem em ' + c.fim, ref);
      }
      const k = norm(c.titulo);
      if (k.length < 15) add(c, 'R09', 'Título: "' + c.titulo + '"', ref);
      else if (titCount[k] > 1) add(c, 'R09', 'Título repetido em ' + titCount[k] + ' contratações', ref);
      if (!c.area || !c.prioridade) add(c, 'R13', 'Área: "' + c.area + '" · Prioridade: "' + c.prioridade + '"', ref);
      if (!(c.total > 0)) add(c, 'R14', 'Total = ' + c.total, ref);
      const sem = c.itens.filter(i => !i.cod_item).length;
      if (sem) add(c, 'R08', sem + ' de ' + c.itens.length + ' itens sem código', ref);
      const frac = v => v != null && Math.abs(v * 100 - Math.round(v * 100)) > 1e-6;
      const bad = c.itens.filter(i => frac(i.vunit_n) || frac(i.vtotal_n));
      if (bad.length) add(c, 'R07', bad.length + ' item(ns), ex.: unitário "' + bad[0].vunit + '", total "' + bad[0].vtotal + '"', ref);
      const dv = c.itens.filter(i => i.vunit_n != null && i.qtd_n != null && i.vtotal_n != null && Math.abs(i.vunit_n * i.qtd_n - i.vtotal_n) > Math.max(0.05, Math.abs(i.vtotal_n) * 0.001));
      if (dv.length) add(c, 'R06', dv.length + ' item(ns), ex.: ' + dv[0].vunit + ' × ' + dv[0].qtd + ' ≠ ' + dv[0].vtotal, ref);
      const cls = new Set(c.itens.map(i => i.classificacao).filter(Boolean));
      const cat = (c.categoria || '').toUpperCase();
      if ((cat === 'BENS' && cls.has('Serviço')) || (cat.startsWith('SERV') && cls.has('Material'))) add(c, 'R12', 'Categoria ' + c.categoria + ' · itens: ' + [...cls].join('/'), ref);
      const mixed = c.dfds.filter(d => dfdCls[d] && dfdCls[d].size > 1);
      if (mixed.length) add(c, 'R10', 'DFD ' + mixed.slice(0, 3).join(', '), ref);
      const rep = c.itens.filter(i => dfdItem[i.dfd + '#' + i.item_dfd] && dfdItem[i.dfd + '#' + i.item_dfd].size > 1);
      if (rep.length) add(c, 'R15', 'DFD ' + rep[0].dfd + ' item ' + rep[0].item_dfd + ' em mais de uma contratação', ref);
    });
    return out;
  }

  function cruzar(a, b) {
    const tb = b.cs.map(c => ({c, t: toks(c.titulo)}));
    const usado = new Set(); const pares = [];
    a.cs.forEach(x => {
      const tx = toks(x.titulo); let best = null, bs = 0;
      tb.forEach(y => { const s = jacc(tx, y.t); if (s > bs) { bs = s; best = y.c; } });
      if (best && bs >= 0.6) { usado.add(best.id); pares.push({a: x, b: best, s: bs}); } else pares.push({a: x, b: null, s: 0});
    });
    const novos = b.cs.filter(c => !usado.has(c.id));
    return {pares, novos};
  }


  function parsePNCP(text) {
    const i = text.indexOf('controle;'); if (i < 0) return {rows: [], coletado: null};
    const r = parseCSV(text.slice(i)); const h = r[0]; const ix = k => h.indexOf(k);
    const f = x => { const v = parseFloat(x); return isNaN(v) ? 0 : v; };
    let max = null;
    const rows = r.slice(1).filter(x => x.length >= 9).map(x => {
      const o = {controle: x[ix('controle')], mod: x[ix('modalidade')], numero: x[ix('numero')], ano: x[ix('ano')], objeto: (x[ix('objeto')] || '').trim(),
        est: f(x[ix('valor_estimado')]), hom: f(x[ix('valor_homologado')]), pub: (x[ix('publicacao')] || '').slice(0, 10), sit: x[ix('situacao')]};
      o.id = o.controle.split('-').pop();
      const c = ix('coletado_em') >= 0 ? x[ix('coletado_em')] : ''; if (c && (!max || c > max)) max = c;
      return o;
    });
    return {rows, coletado: max};
  }
  const STOP2 = new Set(['de','da','do','das','dos','para','e','a','o','em','por','com','no','na','ao','aos','as','os','que','ff','fundacao','florestal','contratacao','servicos','servico','aquisicao','conforme','termo','referencia','edital','anexos','pca','sao','paulo','estado','unidades','unidade','conservacao','prestacao','empresa','especializada']);
  const toks2 = s => new Set(norm(s).split(' ').filter(w => w.length > 2 && !STOP2.has(w)).map(w => w.slice(0, 6)));
  function cruzarPNCP(ds, pub, vinc) {
    const byid = {}; pub.forEach(p => byid[p.id] = p);
    const PT = pub.map(p => ({p, t: toks2(p.objeto)}));
    return ds.cs.map(c => {
      const v = (vinc || {})[ds.ano + ':' + c.num];
      let ids = [], conf = '', obs = '';
      if (v) { ids = v.ids.filter(i => byid[i]); conf = v.conf; obs = v.obs || ''; }
      else {
        const tc = toks2(c.titulo); let best = null, bs = 0;
        PT.forEach(({p, t}) => { let i = 0; tc.forEach(x => { if (t.has(x)) i++; }); if (!i) return;
          const s = i / Math.min(tc.size, t.size) * 0.6 + i / (tc.size + t.size - i) * 0.4;
          if (p.ano === String(ds.ano) && (i >= 2 || s >= 0.95) && s > bs) { bs = s; best = p; } });
        if (best && bs >= 0.6) { ids = [best.id]; conf = 'sugestão'; obs = 'Sugestão automática (' + Math.round(bs * 100) + '%): confirmar.'; }
      }
      const ps = ids.map(i => byid[i]);
      const hom = ps.reduce((s, p) => s + (p.sit === 'Anulada' ? 0 : p.hom), 0);
      const status = !ps.length ? 'Sem publicação localizada' : hom > 0 ? 'Contratada (homologada)' : 'Publicada, sem homologação';
      return {num: c.num, titulo: c.titulo, area: c.area, pca: c.total, ids, conf, obs, status, est: ps.reduce((s, p) => s + p.est, 0), hom};
    });
  }
  function exportCSV(ds, ov, keep) {
    const head = 'Número da contratação;Status da contratação;Situação da Execução;Título da contratação;Categoria da contratação;UASG Atual;Data estimada para o início do processo de contratação;Data estimada para a conclusão do processo de contratação;Prazo estimado de duração do processo de contratação (dias);Área requisitante;Nº DFD;Prioridade;Nº do Item no DFD;Data da conclusão da Contratação no DFD;Classificação da Contratação;Código Classe/Grupo;Nome Classe/Grupo;Código PDM material;Nome do PDM material;Código material/serviço;Descrição material/serviço;Unidade Fornecimento;Valor Unitário;Quantidade;Valor Total';
    const lines = [head];
    ds.items.forEach(it => {
      const o = {...it}; const c = ds.cs.find(x => x.num === it.num); if (keep && c && !keep(c)) return; const f = (ov && c && ov[c.id]) || {};
      ['num','titulo','ini','fim','prazo','area','prioridade','categoria'].forEach(k => { if (f[k]) o[k] = f[k]; });
      if (f.fim) o.conclusao_dfd = f.fim;
      lines.push(COLS.map(k => String(o[k] ?? '').replace(/;/g, ',')).join(';'));
    });
    return '﻿' + lines.join('\r\n');
  }
  return {parsePNCP, cruzarPNCP, COLS, decode, parseCSV, load, validar, cruzar, exportCSV, REGRAS, norm, slug, fdate, pdate};
})();


const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const S={meta:{},ano:2026,tab:'painel',pn:null,vinc:{},dest:{},pst:'',pnMsg:'',ds:{},val:{},aj:{},ov:{},db:null,uid:null,msg:'',fsev:'',freg:'',fst:'',q:''};
const ST={pendente:'Pendente',ajustado:'Ajustado',justificado:'Justificado / aceito'};
const ajId=(cid,r)=>cid+'_'+r;
function setDS(ano,text){S.ds[ano]=Core.load(text,ano);S.val[ano]=Core.validar(S.ds[ano]);}
const cur=()=>S.ds[S.ano]||null, vals=()=>S.val[S.ano]||[];
const stOf=v=>(S.aj[ajId(v.cid,v.regra)]||{}).status||'pendente';

/* ===== Armazenamento: GitHub (decisoes.json) + arquivos da pasta coleta/ ===== */
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const guess=(()=>{const m=location.hostname.match(/^([^.]+)\.github\.io$/),p=location.pathname.split('/').filter(Boolean);return m&&p[0]?m[1]+'/'+p[0]:'';})();
const Store={
  cfg:{token:LS.get('gh_token'),repo:LS.get('gh_repo')||guess,path:LS.get('gh_path')||'decisoes.json',nome:LS.get('gh_nome')},
  data:{ajustes:{},ov:{},destino:{},vinc:{}},sha:null,
  get canWrite(){return !!(this.cfg.token&&this.cfg.repo);},
  url(){return 'https://api.github.com/repos/'+this.cfg.repo+'/contents/'+this.cfg.path.split('/').map(encodeURIComponent).join('/');},
  hdr(){return {Accept:'application/vnd.github+json',Authorization:'Bearer '+this.cfg.token};},
  async load(){
    let j=null;
    try{
      if(this.canWrite){const r=await fetch(this.url()+'?t='+Date.now(),{headers:this.hdr()});
        if(r.ok){const o=await r.json();this.sha=o.sha;j=JSON.parse(decodeURIComponent(escape(atob(o.content.replace(/\n/g,'')))));}
        else if(r.status===404){this.sha=null;j={};}
        else throw new Error('GitHub respondeu '+r.status+' ao ler as decisões (confira repositório e token).');}
      else{const r=await fetch('decisoes.json?t='+Date.now());if(r.ok)j=await r.json();}
    }catch(e){S.msg=e.message||'Falha ao ler decisões.';}
    if(j){this.data={ajustes:j.ajustes||{},ov:j.ov||{},destino:j.destino||{},vinc:j.vinc||{}};}
    S.aj=this.data.ajustes;S.ov=this.data.ov;S.dest=this.data.destino;S.vinc=this.data.vinc;
  },
  async mutate(fn){
    if(!this.canWrite){S.msg='Modo leitura: informe o token do GitHub em Configurações para salvar decisões.';draw();return false;}
    for(let t=0;t<3;t++){
      fn(this.data);S.aj=this.data.ajustes;S.ov=this.data.ov;S.dest=this.data.destino;S.vinc=this.data.vinc;draw();
      const body={message:'Decisão registrada por '+(this.cfg.nome||'equipe'),content:btoa(unescape(encodeURIComponent(JSON.stringify(this.data,null,1))))};
      if(this.sha)body.sha=this.sha;
      try{const r=await fetch(this.url(),{method:'PUT',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(r.ok){const o=await r.json();this.sha=o.content.sha;return true;}
        if(r.status===409||r.status===422){await this.load();continue;}
        S.msg='Não foi possível salvar ('+r.status+'). Confira o token e a permissão de escrita.';draw();return false;
      }catch(e){S.msg='Falha de rede ao salvar.';draw();return false;}
    }
    return false;
  }
};

  const q=$('#q');if(q)q.oninput=()=>{S.q=q.value;clearTimeout(window._t);window._t=setTimeout(()=>{draw();const n=$('#q');n.focus();n.setSelectionRange(99,99);},250);};
  document.querySelectorAll('[data-up]').forEach(i=>i.onchange=()=>i.files[0]&&onFile(i.files[0],+i.dataset.up));
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const [cid,r]=b.dataset.act.split('|');treat(cid,r);});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>edit(b.dataset.ed));
  document.querySelectorAll('[data-dest]').forEach(s=>s.onchange=()=>{const c=allCs().find(x=>x.id==s.dataset.dest);if(c)setDest(c,s.value);});
  document.querySelectorAll('[data-vc]').forEach(b=>b.onclick=()=>decideVinc(b.dataset.vc,true));
  document.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>decideVinc(b.dataset.vd,false));
  const e=$('#exp');if(e)e.onclick=()=>save('PCA_'+S.ano+'_adequado.csv',Core.exportCSV(cur(),ovF(),c=>{const k=destOf(c);return k!='cancelar'&&k!='proximo';}));
  const en=$('#expn');if(en)en.onclick=()=>save('PCA_'+S.ano+'_itens_para_'+(S.ano+1)+'.csv',Core.exportCSV(cur(),ovF(),c=>destOf(c)=='proximo'));
  const r=$('#expr');if(r)r.onclick=()=>save('Apontamentos_PCA_'+S.ano+'.csv','\uFEFFContratação;Regra;Descrição;Detalhe;Gravidade;Situação;Observação\r\n'+vals().map(a=>[a.num,a.regra,a.desc,a.det,a.sev,ST[stOf(a)],(S.aj[ajId(a.cid,a.regra)]||{}).obs||''].map(x=>String(x).replace(/;/g,',')).join(';')).join('\r\n'));
}
async function save(name,data){const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function treat(cid,r){
  const a=allVals().find(x=>x.cid==cid&&x.regra==r),cur0=S.aj[ajId(cid,r)]||{};const dlg=$('#dlg');
  dlg.innerHTML=`<h3>${esc(a.num)} · ${r}</h3><p>${esc(a.desc)}<br><span class="sub">${esc(a.det)}</span></p><label>Situação</label><select id="d1">${Object.keys(ST).map(k=>`<option value="${k}" ${(cur0.status||'pendente')==k?'selected':''}>${ST[k]}</option>`).join('')}</select><label>Observação / justificativa</label><textarea id="d2" rows="3">${esc(cur0.obs||'')}</textarea><div class="row" style="margin-top:12px"><button class="p" id="d3">Salvar</button><button class="s" id="d4">Cancelar</button></div>`;
  dlg.showModal();$('#d4').onclick=()=>dlg.close();$('#d3').onclick=()=>{setStatus(cid,r,$('#d1').value,$('#d2').value);dlg.close();};
}
function edit(cid){
  const c=allCs().find(x=>x.id==cid),o=(S.ov[cid]||{}).f||{};const F=[['num','Número'],['titulo','Título'],['ini','Início (dd/mm/aaaa)'],['fim','Conclusão (dd/mm/aaaa)'],['prazo','Prazo (dias)'],['area','Área requisitante'],['prioridade','Prioridade']];
  const dlg=$('#dlg');dlg.innerHTML=`<h3>Adequar ${esc(c.num)}</h3><p class="sub">Original → o valor editado entra no CSV exportado.</p>`+F.map(f=>`<label>${f[1]} <span class="sub">(original: ${esc(c[f[0]])})</span></label><input data-f="${f[0]}" value="${esc(o[f[0]]??c[f[0]])}">`).join('')+`<div class="row" style="margin-top:12px"><button class="p" id="d3">Salvar</button><button class="s" id="d4">Cancelar</button></div>`;
  dlg.showModal();$('#d4').onclick=()=>dlg.close();
  $('#d3').onclick=()=>{const f={};dlg.querySelectorAll('[data-f]').forEach(i=>{if(i.value.trim()!==c[i.dataset.f])f[i.dataset.f]=i.value.trim();});
    if(f.fim&&!Core.pdate(f.fim)){S.msg='Data de conclusão inválida.';dlg.close();draw();return;}if(f.ini&&!Core.pdate(f.ini)){S.msg='Data de início inválida.';dlg.close();draw();return;}
    saveOv(cid,f);dlg.close();};
}
init();
</script>
</html>
