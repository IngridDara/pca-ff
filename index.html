/* Conexão com o Firebase (Firestore + login Google). Se falhar, o painel segue em modo consulta. */
(async()=>{
  try{
    const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
    const [A,F,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp({apiKey:"AIzaSyDgvUq6uNbGJCaQH9rg6jSNE4PtVkAmxpA",authDomain:"pca-ff.firebaseapp.com",projectId:"pca-ff",storageBucket:"pca-ff.firebasestorage.app",messagingSenderId:"654289439934",appId:"1:654289439934:web:dcf27780d0757595da22ef"});
    const db=F.initializeFirestore(app,{experimentalForceLongPolling:true}),au=U.getAuth(app);
    const clean=o=>JSON.parse(JSON.stringify(o));
    const iso=v=>v&&v.toDate?v.toDate().toISOString():(v||'');
    const uref=(c,id)=>F.doc(db,c,id);
    window.FB={
      onAuth:cb=>U.onAuthStateChanged(au,cb),
      login:(e,s)=>U.signInWithEmailAndPassword(au,e,s),
      async cadastrar(nome,setor,email,senha){
        const c=await U.createUserWithEmailAndPassword(au,email,senha);
        await F.setDoc(uref('usuarios',c.user.uid),{nome,setor,email,status:'pendente',criadoEm:F.serverTimestamp()});
        try{await U.sendEmailVerification(c.user);}catch(e){}
        return c.user;},
      reenviarVerif:()=>U.sendEmailVerification(au.currentUser),
      async recarregar(){await au.currentUser.reload();await au.currentUser.getIdToken(true);},
      autoAprovar:uid=>F.updateDoc(uref('usuarios',uid),clean({status:'aprovado',papel:'proponente',por:'automático (e-mail @fflorestal.sp.gov.br confirmado)',decididoEm:new Date().toISOString()})),
      reset:e=>U.sendPasswordResetEmail(au,e),
      logout:()=>U.signOut(au),
      async papel(uid){
        const [a,v,u]=await Promise.all([F.getDoc(uref('admins',uid)),F.getDoc(uref('validadores',uid)),F.getDoc(uref('usuarios',uid))]);
        return {verificado:!!(au.currentUser&&au.currentUser.emailVerified),admin:a.exists(),validador:a.exists()||v.exists(),status:u.exists()?u.data().status:'',nome:u.exists()?u.data().nome:'',setor:u.exists()?u.data().setor:'',papel:u.exists()?(u.data().papel||''):''};},
      async decidirUsuario(u,dec,por,papel){
        const b=F.writeBatch(db),at=new Date().toISOString();
        if(dec==='aprovado'&&papel==='validador')b.set(uref('validadores',u.id),clean({nome:u.nome,setor:u.setor,email:u.email,por,at}));
        else b.delete(uref('validadores',u.id));
        b.update(uref('usuarios',u.id),clean({status:dec,por,decididoEm:at,papel:dec==='aprovado'?(papel||'proponente'):''}));await b.commit();},
      async listCalendario(){const r=await F.getDocs(F.collection(db,'calendario'));const o={};r.docs.forEach(d=>o[d.id]=d.data().marcos||[]);return o;},
      setCalendario:(ano,marcos)=>F.setDoc(F.doc(db,'calendario',ano),clean({marcos,at:new Date().toISOString()})),
      async listDecisoes(){const r=await F.getDocs(F.collection(db,'decisoes'));return r.docs.map(d=>d.data());},
      setDecisao:(id,o)=>F.setDoc(F.doc(db,'decisoes',id),clean(o)),
      addAudit:o=>F.addDoc(F.collection(db,'auditoria'),clean(o)),
      async enviar(lote,itens){const b=F.writeBatch(db);itens.forEach(it=>b.set(F.doc(F.collection(db,'propostas')),{...clean(it),lote,uid:au.currentUser.uid,status:'pendente',criadoEm:F.serverTimestamp()}));await b.commit();},
      async getRascunho(uid){const d=await F.getDoc(uref('rascunhos',uid));return d.exists()?d.data():null;},
      setRascunho:(uid,itens)=>F.setDoc(uref('rascunhos',uid),{itens:JSON.parse(JSON.stringify(itens)),at:new Date().toISOString()}),
      updProp:(id,patch)=>F.updateDoc(F.doc(db,'propostas',id),clean(patch)),
      watchMinhas(uid,cb,err){return F.onSnapshot(F.query(F.collection(db,'propostas'),F.where('uid','==',uid)),snap=>cb(snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,at:iso(x.criadoEm||x.at)};})),err);},
      watch(nome,cb,err){return F.onSnapshot(F.query(F.collection(db,nome),F.orderBy(nome==='auditoria'?'at':'criadoEm')),
        snap=>cb(snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,at:iso(x.criadoEm||x.at)};})),err);}
    };
  }catch(e){console.error('Firebase indisponível',e);window.FB=null;}
  dispatchEvent(new Event('fb-ready'));
})();
</script>
<script>
const Core = (() => {
  const COLS = ['num','status','situacao','titulo','categoria','uasg','ini','fim','prazo','area','dfd','prioridade','item_dfd','conclusao_dfd','classificacao','cod_grupo','nome_grupo','cod_pdm','nome_pdm','cod_item','desc_item','unid','vunit','qtd','vtotal'];
  function decode(buf) {
    try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }
  }
  function parseCSV(t, sep = ';') {
    if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
    const rows = []; let row = [], f = '', q = false, start = true;
    const end = c => c === undefined || c === sep || c === '\n' || c === '\r';
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c === '"') {
          if (t[i+1] === '"') { f += '"'; i++; }
          else if (end(t[i+1])) q = false;
          else f += '"';
        } else f += c;
      }
      else if (c === '"' && start) { q = true; start = false; }
      else if (c === sep) { row.push(f); f = ''; start = true; }
      else if (c === '\n') { row.push(f.replace(/\r$/, '')); rows.push(row); row = []; f = ''; start = true; }
      else { f += c; start = false; }
    }
    if (f || row.length) { row.push(f.replace(/\r$/, '')); rows.push(row); }
    return rows.filter(r => r.some(x => x.trim() !== ''));
  }
  const num = s => { s = (s || '').trim(); if (!s) return null; const v = parseFloat(s.replace(/\./g, '').replace(',', '.')); return isNaN(v) ? null : v; };
  const decs = s => { const m = (s || '').trim().match(/,(\d+)$/); return m ? m[1].length : 0; };
  function pdate(s) {
    const m = (s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    const d = new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    return d.getUTCDate() === +m[1] ? d : null;
  }
  const fdate = d => d ? String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + d.getUTCFullYear() : '';
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const slug = s => String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const STOP = new Set(['de','da','do','das','dos','para','e','a','o','em','por','com','no','na','ff','pca']);
  const toks = s => new Set(norm(s).split(' ').filter(w => w.length > 2 && !STOP.has(w)));
  function jacc(a, b) { let i = 0; a.forEach(x => { if (b.has(x)) i++; }); const u = a.size + b.size - i; return u ? i / u : 0; }

  function load(buf, ano) {
    const text = typeof buf === 'string' ? buf : decode(buf);
    const all = parseCSV(text);
    const body = all.slice(1);
    const items = body.map((r, i) => { const o = {_l: i + 2}; COLS.forEach((c, k) => o[c] = (r[k] || '').trim()); o.vunit_n = num(o.vunit); o.qtd_n = num(o.qtd); o.vtotal_n = num(o.vtotal); return o; });
    const map = new Map();
    items.forEach(it => {
      let c = map.get(it.num);
      if (!c) { c = {num: it.num, ano, id: ano + '-' + slug(it.num), titulo: it.titulo, status: it.status, categoria: it.categoria, area: it.area, prioridade: it.prioridade, uasg: it.uasg, ini: it.ini, fim: it.fim, prazo: it.prazo, itens: [], dfds: new Set(), total: 0, linhas: []}; map.set(it.num, c); }
      c.itens.push(it); c.dfds.add(it.dfd); c.total += it.vtotal_n || 0; c.linhas.push(it._l);
    });
    const cs = [...map.values()].map(c => ({...c, dfds: [...c.dfds]}));
    return {ano, items, cs, text};
  }

  const REGRAS = {
    R01: ['crit', 'Número da contratação inválido (esperado N/AAAA)'],
    R02: ['crit', 'Data de início ou conclusão ausente/inválida'],
    R03: ['crit', 'Conclusão anterior ao início'],
    R04: ['med', 'Prazo informado diverge de (conclusão − início)'],
    R05: ['med', 'Datas fora do exercício do PCA'],
    R06: ['crit', 'Valor total diverge de valor unitário × quantidade'],
    R07: ['med', 'Valor com separador/casas decimais anômalos'],
    R08: ['med', 'Item sem código CATMAT/CATSER'],
    R09: ['baixa', 'Título curto demais ou duplicado'],
    R10: ['med', 'DFD misturando bens e serviços'],
    R11: ['baixa', 'Concentração de conclusões na mesma data'],
    R12: ['med', 'Categoria da contratação incoerente com os itens'],
    R13: ['med', 'Área requisitante ou prioridade em branco'],
    R14: ['crit', 'Valor total zero, negativo ou ausente'],
    R15: ['med', 'Item de DFD repetido em contratações diferentes']
  };

  function validar(ds) {
    const out = []; const ano = ds.ano;
    const add = (c, r, det, ref) => out.push({id: c.id + '|' + r, cid: c.id, num: c.num, regra: r, sev: REGRAS[r][0], desc: REGRAS[r][1], det, ref: ref || ''});
    const fimCount = {}; ds.cs.forEach(c => { fimCount[c.fim] = (fimCount[c.fim] || 0) + 1; });
    const titCount = {}; ds.cs.forEach(c => { const k = norm(c.titulo); titCount[k] = (titCount[k] || 0) + 1; });
    const dfdItem = {}; ds.items.forEach(it => { if (it.dfd && it.item_dfd) (dfdItem[it.dfd + '#' + it.item_dfd] ||= new Set()).add(it.num); });
    const dfdCls = {}; ds.items.forEach(it => { if (it.dfd) (dfdCls[it.dfd] ||= new Set()).add(it.classificacao); });
    const thr = Math.max(8, Math.ceil(ds.cs.length * 0.15));
    ds.cs.forEach(c => {
      const ref = 'linha(s) ' + c.linhas.slice(0, 4).join(', ') + (c.linhas.length > 4 ? '…' : '');
      if (!/^\d{1,4}\/\d{4}$/.test(c.num)) add(c, 'R01', 'Valor lido: "' + c.num + '"', ref);
      const di = pdate(c.ini), df = pdate(c.fim);
      if (!di || !df) add(c, 'R02', 'Início "' + c.ini + '" · conclusão "' + c.fim + '"', ref);
      else {
        if (df < di) add(c, 'R03', fdate(di) + ' → ' + fdate(df), ref);
        const dd = Math.round((df - di) / 864e5), pz = parseInt(c.prazo, 10);
        if (isNaN(pz) || Math.abs(dd - pz) > 3) add(c, 'R04', 'Prazo informado ' + (c.prazo || '—') + ' d · calculado ' + dd + ' d', ref);
        if (di.getUTCFullYear() < ano - 1 || df.getUTCFullYear() > ano + 1 || df.getUTCFullYear() < ano) add(c, 'R05', fdate(di) + ' → ' + fdate(df) + ' (PCA ' + ano + ')', ref);
        if (fimCount[c.fim] >= thr) add(c, 'R11', fimCount[c.fim] + ' contratações concluem em ' + c.fim, ref);
      }
      const k = norm(c.titulo);
      if (k.length < 15) add(c, 'R09', 'Título: "' + c.titulo + '"', ref);
      else if (titCount[k] > 1) add(c, 'R09', 'Título repetido em ' + titCount[k] + ' contratações', ref);
      if (!c.area || !c.prioridade) add(c, 'R13', 'Área: "' + c.area + '" · Prioridade: "' + c.prioridade + '"', ref);
      if (!(c.total > 0)) add(c, 'R14', 'Total = ' + c.total, ref);

function proporAlteracao(base){
  return new Promise(res=>{
    const d=$('#dj');const i=ident();const ok=identOk(i);
    d.innerHTML=`<h3>Propor alteração</h3><p><b>${esc(base.acao)} · ${esc(base.ref)}</b></p><p class="sub">De: ${esc(base.antes||'—')}<br>Para: ${esc(base.depois||'—')}</p>

    <label>Justificativa (mínimo ${JUST_MIN} caracteres)</label><textarea id="jt" rows="3"></textarea><div class="sub" id="je" style="color:var(--crit)"></div>
    <div class="row" style="margin-top:12px"><button class="p" id="pm">Adicionar às minhas propostas</button><button class="s" id="jno">Cancelar</button></div>`;
    d.showModal();let feito=false;const fim=v=>{if(feito)return;feito=true;d.close();res(v);};
    $('#jno').onclick=()=>fim(false);d.oncancel=()=>fim(false);
    $('#pm').onclick=()=>{
      if(!ok){const n={nome:$('#pn').value.trim(),setor:$('#ps').value.trim(),email:$('#pe').value.trim().toLowerCase()};
        if(!identOk(n)){$('#je').textContent='Informe nome, setor e e-mail institucional (terminado em sp.gov.br).';return;}
        LS.set('prop_nome',n.nome);LS.set('prop_setor',n.setor);LS.set('prop_email',n.email);}
      const j=$('#jt').value.trim();if(j.length<JUST_MIN){$('#je').textContent='Escreva a justificativa (mínimo '+JUST_MIN+' caracteres).';return;}
      const ch=base.ap.t+'|'+(base.ap.id||base.ap.cid||base.ap.key);
      const c=Cesta.get().filter(x=>x.ch!==ch);c.push({id:rid(),ch,at:new Date().toISOString(),...base,just:j});Cesta.set(c);
      S.msg='Proposta adicionada (' + c.length + ' na cesta). Quando terminar, abra "Minhas propostas" e envie todas à coordenação.';fim(true);draw();};
  });
}

async function enviarCesta(){
  const C=Cesta.get(),i=ident();
  if(!C.length)return;
  if(!identOk(i)){exigeLogin();return;}
  const sj=C.filter(x=>!justOk(x));
  if(sj.length){S.msg=sj.length+' proposta(s) sem justificativa (mínimo '+JUST_MIN+' caracteres). Preencha na coluna Justificativa antes de enviar.';draw();return;}
  if(!Store.fb){S.msg='Sem conexão com o servidor: suas propostas continuam guardadas aqui. Tente novamente em instantes.';draw();return;}
  const lote='PCA-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+rid().slice(0,5).toUpperCase();
  const itens=C.map(p=>({nome:i.nome,setor:i.setor,email:i.email,acao:String(p.acao),cid:String(p.cid),ref:String(p.ref),ano:String(p.ano||''),titulo:String(p.titulo||''),area:String(p.area||''),antes:String(p.antes||''),depois:String(p.depois||''),just:justFinal(p),ap:p.ap}));
  S.msg='Enviando…';draw();
  try{await Store.fb.enviar(lote,itens);Cesta.set([]);Envios.add({lote,at:new Date().toISOString(),n:itens.length,itens:itens.map(x=>({ref:x.ref,titulo:x.titulo,area:x.area,acao:x.acao,antes:x.antes,depois:x.depois,just:x.just,ano:x.ano}))});
    S.msg='Enviado! Protocolo '+lote+' ('+itens.length+' proposta(s)). A coordenação já as recebe no painel. Baixe a tabela das suas alterações em "Minhas propostas".';}
  catch(e){S.msg='Não foi possível enviar ('+(e.code||e.message)+'). Suas propostas continuam guardadas; tente de novo.';}
  draw();
}
async function validar(id,dec){
  if(!Store.canWrite){S.msg='Somente quem tem acesso de validação pode aprovar ou recusar.';draw();return;}
  const p=(S.prop||[]).find(x=>x.id===id);if(!p)return;
  /* aprovar não exige justificativa; recusar continua exigindo o motivo */
  const j=dec==='aprovada'?'Aprovada pela coordenação.':await justificar('Recusar proposta · '+p.ref,p.antes,p.depois,'Motivo da recusa');
  if(j===null)return;
  const aud={acao:'Validação: '+dec,cid:p.cid,ref:p.ref,antes:p.antes,depois:p.depois,just:j,prop:p.prop.nome+' · '+p.prop.setor,pjust:p.just};
  let ok;
  if(dec==='aprovada')ok=await Store.gravar(p.ap,aud,p.prop.nome+' (validado por '+who()+')');else ok=await Store.auditar(aud);
  if(!ok)return;
  try{await Store.fb.updProp(id,{status:dec,val:{uid:who(),at:new Date().toISOString(),coment:j}});}
  catch(e){S.msg='A decisão foi aplicada, mas não consegui marcar a proposta ('+(e.code||e.message)+').';draw();}
}

function gantt(M,st,E){

function cfg(){
  const m=Store.me,f=S.fm=S.fm||{},modo=S.cfgModo||'entrar';
  const aviso=S.msg?`<div class="msg" role="alert">${esc(S.msg)}</div>`:'';
  if(!Store.fb)return `<div class="acesso"><div class="box">${aviso}<h2>Acesso</h2><span class="tag crit">Sem conexão com o servidor</span><p class="sub">Não foi possível falar com o servidor agora. O painel continua disponível para consulta; recarregue a página para tentar de novo.</p></div></div>`;
  if(m){
    const papel=m.admin?'Administradora':m.validador?'Validador(a)':m.status==='aprovado'?'Proponente':m.status==='pendente'?'Cadastro aguardando aprovação':'Sem acesso liberado';
    const cl=m.validador||m.status==='aprovado'?'ok':'med';
    const aguarda=m.status==='pendente'&&m.dom&&!m.verificado;
    const txt=aguarda?`Falta confirmar seu e-mail. Enviamos um link para <b>${esc(m.email)}</b>. Clique nele (veja também o spam) e depois toque em “Já confirmei”: o acesso é liberado automaticamente.`:m.validador?'Você pode revisar, aprovar propostas e registrar decisões diretamente.':m.status==='aprovado'?'Você pode revisar os itens do PCA e enviar suas propostas à coordenação.':m.status==='pendente'?'Seu cadastro foi enviado. Assim que o NGI aprovar, a revisão será liberada para você.':'Este acesso não está liberado. Fale com o NGI.';
    return `<div class="acesso"><div class="box">${aviso}<div class="perfil"><div class="avatar" aria-hidden="true">${esc((m.name||m.email||'?').trim().charAt(0).toUpperCase())}</div><div><b>${esc(m.name||m.email)}</b><br><span class="sub">${esc(m.setor||'')}${m.setor?' · ':''}${esc(m.email)}</span><br><span class="tag ${cl}">${papel}</span></div></div>
    <p class="sub">${txt}</p>
    ${aguarda?'<div class="row"><button class="p" id="c_recheck">Já confirmei</button><button class="s" id="c_reenv">Reenviar e-mail</button></div>':''}
    <div class="row">${Store.podeRevisar?'<button class="p" data-t="itens">Ir para a Revisão</button>':''}${Store.canWrite?'':'<button class="s" data-t="minhas">Minhas propostas</button>'}<button class="s" id="c_out">Sair</button></div></div></div>`;
  }
  const campo=(id,rot,tipo,auto,v,dica)=>`<label class="fld" for="${id}"><span>${rot}</span><input id="${id}" data-fm="${id}" type="${tipo}" autocomplete="${auto}" value="${esc(v||'')}">${dica?`<small class="sub">${dica}</small>`:''}</label>`;
  const cad=modo==='cadastro';
  return `<div class="acesso"><div class="box">${aviso}
  <h2>${cad?'Pedir cadastro':'Entrar'}</h2>
  <p class="sub">${cad?'Para revisar o PCA e enviar propostas é preciso ter cadastro. <div class="msg" style="margin-top:8px"><b>Só são aceitos e-mails @fflorestal.sp.gov.br.</b> O acesso é liberado automaticamente depois que você confirmar o e-mail.</div>':'Entre com seu e-mail institucional para iniciar a revisão do PCA. Consultar o painel não exige login.'}</p>
  <div class="seg" role="tablist"><button type="button" role="tab" class="${!cad?'on':''}" data-modo="entrar">Já tenho cadastro</button><button type="button" role="tab" class="${cad?'on':''}" data-modo="cadastro">Pedir cadastro</button></div>
  <form id="f_acesso" novalidate>
    ${cad?campo('fm_nome','Nome completo','text','name',f.fm_nome)+campo('fm_setor','Setor / área','text','organization',f.fm_setor):''}
    ${campo('fm_email','E-mail institucional','email','username',f.fm_email,cad?'Somente @fflorestal.sp.gov.br':'')}
    <label class="fld" for="fm_senha"><span>Senha</span><span class="pw"><input id="fm_senha" data-fm="fm_senha" type="${S.verSenha?'text':'password'}" autocomplete="${cad?'new-password':'current-password'}" value="${esc(f.fm_senha||'')}"><button type="button" class="s" id="c_ver" aria-label="${S.verSenha?'Ocultar':'Mostrar'} senha">${S.verSenha?'Ocultar':'Mostrar'}</button></span>${cad?'<small class="sub">Mínimo de 6 caracteres</small>':''}</label>
    ${cad?campo('fm_senha2','Repita a senha','password','new-password',f.fm_senha2):''}
    <button class="p full" type="submit" id="${cad?'c_cad':'c_in'}">${cad?'Enviar pedido de cadastro':'Entrar'}</button>
    ${cad?'':'<button type="button" class="lnk" id="c_esq">Esqueci a senha</button>'}
  </form></div></div>`;
}

function cad(){
  const U=(Store.usuarios||[]).slice().reverse();
  const tg=s=>s==='pendente'?'<span class="tag med">Pendente</span>':s==='aprovado'?'<span class="tag ok">Aprovado</span>':'<span class="tag crit">'+(s==='revogado'?'Revogado':'Recusado')+'</span>';
  return `<p class="sub">Pedidos de cadastro. <b>Proponente</b> (as áreas): faz a revisão e envia propostas. <b>Validador</b>: além disso, lê as propostas e grava decisões. Só quem você aprovar aqui entra.</p>
  <div class="tw"><table><thead><tr><th>Pedido em</th><th>Nome</th><th>Setor</th><th>E-mail</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${U.map(u=>`<tr><td>${fmtDT(u.at)}</td><td><b>${esc(u.nome)}</b></td><td>${esc(u.setor)}</td><td>${esc(u.email)}</td><td>${tg(u.status)}${u.por?'<br><span class="sub">por '+esc(u.por)+'</span>':''}</td><td>${u.id===(Store.me||{}).uid?'<span class="sub">você</span>':u.status==='pendente'?`<button class="p" data-ud="${u.id}|aprovado|proponente">Aprovar como proponente</button> <button class="s" data-ud="${u.id}|aprovado|validador">Aprovar como validador</button> <button class="s" data-ud="${u.id}|recusado">Recusar</button>`:u.status==='aprovado'?`<span class="tag ${u.papel==='validador'?'ok':'med'}">${u.papel==='validador'?'Validador(a)':'Proponente'}</span> ${u.papel==='validador'?`<button class="s" data-ud="${u.id}|aprovado|proponente">Rebaixar para proponente</button>`:`<button class="p" data-ud="${u.id}|aprovado|validador">Promover a validador</button>`} <button class="s" data-ud="${u.id}|revogado">Revogar acesso</button>`:`<button class="s" data-ud="${u.id}|aprovado|proponente">Aprovar como proponente</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="sub">Nenhum pedido de cadastro ainda.</td></tr>'}</tbody></table></div>`;
}
function dados(){
  const d=cur(),nx=S.ds[S.ano+1];
  return `<div class="box"><b>Conferir um PCA fora do repositório</b><p class="sub">Carrega um CSV só nesta tela, para teste. Para valer para todos, envie <code>pca_2026.csv</code> / <code>pca_2027.csv</code> ao repositório: a rotina converte e publica sozinha.</p>
  <div class="row">${[2026,2027].map(a=>`<label class="s">PCA ${a}${S.ds[a]?' ✓':''} <input type="file" accept=".csv,.txt" data-up="${a}" hidden></label>`).join('')}</div></div>
  <div class="box"><b>Exportar PCA ${S.ano} adequado</b><p class="sub">Aplica as edições da aba Contratações e <b>remove</b> os itens marcados como "Cancelar" ou "Enviar ao PCA seguinte". Reenvie ao sistema após conferência.</p>
  <div class="row"><button class="p" id="exp" ${d?'':'disabled'}>Baixar CSV adequado</button><button class="s" id="expn" ${d?'':'disabled'}>Baixar itens enviados ao PCA ${S.ano+1}</button><button class="s" id="expr" ${d?'':'disabled'}>Baixar relatório de apontamentos</button></div></div>`;
}
function bind(){
  const hq=$('#hq');if(hq)hq.oninput=()=>{S.hq=hq.value;draw();const n=$('#hq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};const hx=$('#hx');if(hx)hx.onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';save('historico_pca.csv','\ufeff'+['Data;Quem;Acao;Item;De;Para;Justificativa'].concat((S.aud||[]).map(a=>[a.at,a.uid,a.acao,a.ref,a.antes,a.depois,a.just].map(q).join(';'))).join('\n'));};document.querySelectorAll('[data-a26]').forEach(e=>{const k=e.dataset.a26;if(e.tagName==='SELECT')e.onchange=()=>{(S.f26=S.f26||{})[k]=e.value;draw();};else e.oninput=()=>{(S.f26=S.f26||{})[k]=e.value;draw();const n=document.querySelector('[data-a26=q]');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};});
  document.querySelectorAll('[data-f26]').forEach(b=>b.onclick=()=>{S.f26={...F26[b.dataset.f26]};draw();});const x=$('#x26');if(x)x.onclick=x26;
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>edit(b.dataset.ed));
  const pf=$('#pf');if(pf)pf.onchange=()=>{S.pf=pf.value;draw();};const pq=$('#pq');if(pq)pq.oninput=()=>{S.pq=pq.value;draw();const n=$('#pq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.pv.split('|');validar(i,d);});
  const px=$('#px');if(px)px.onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const c=['Protocolo','Recebida em','PCA','DFD','Título','Área','Proponente','Setor','E-mail','Ação','De','Para','Justificativa do proponente','Situação','Validado por','Data da validação','Comentário da validação'];save('propostas_pca.csv','\ufeff'+[c.join(';')].concat((S.prop||[]).map(p=>[p.lote,p.at,p.ano,p.ref,p.titulo,p.area,p.prop.nome,p.prop.setor,p.prop.email,p.acao,p.antes,p.depois,p.just,p.status,(p.val||{}).uid,(p.val||{}).at,(p.val||{}).coment].map(q).join(';'))).join('\n'));};
  document.querySelectorAll('[data-fm]').forEach(e=>e.oninput=()=>{(S.fm=S.fm||{})[e.dataset.fm]=e.value;});
  const ro=$('#rec_ok');if(ro)ro.onclick=()=>{LS.set(kU('recusadas_vistas'),JSON.stringify(vistas().concat(recusadasNovas().map(x=>x.id))));draw();};
  const vr=$('#verrev');if(vr)vr.onchange=()=>{S.verRev=vr.checked;draw();};
  document.querySelectorAll('[data-gv]').forEach(b=>b.onclick=()=>{S.vis=b.dataset.gv;const f=gfOf(S.vis);if(f)S.f26={...f};draw();});const fa=$('#farea');if(fa)fa.onchange=()=>{S.farea=fa.value;draw();};
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{S.csub=b.dataset.cs;draw();});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.farea=b.dataset.go;S.tab='itens';window.scrollTo(0,0);draw();});
  const mx=$('#mi_x');if(mx)mx.onclick=()=>xMinhas();document.querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>xMinhas(b.dataset.mx));
  document.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>{S.cfgModo=b.dataset.modo;S.msg='';draw();});
  const F_=()=>S.fm||{};
  const fa_=$('#f_acesso');if(fa_)fa_.onsubmit=e=>{e.preventDefault();if($('#c_cad'))Store.cadastrar({nome:F_().fm_nome,setor:F_().fm_setor,email:F_().fm_email,senha:F_().fm_senha,senha2:F_().fm_senha2});else Store.login((F_().fm_email||'').trim(),F_().fm_senha||'');};
  const cv_=$('#c_ver');if(cv_)cv_.onclick=()=>{S.verSenha=!S.verSenha;draw();const e=$('#fm_senha');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}};
  const ce_=$('#c_esq');if(ce_)ce_.onclick=()=>Store.esqueci((F_().fm_email||'').trim());
  document.querySelectorAll('[data-ud]').forEach(b=>b.onclick=()=>{const [i,d,pp]=b.dataset.ud.split('|');Store.decidir(i,d,pp);});
  const crc=$('#c_recheck');if(crc)crc.onclick=()=>Store.recheck();const cre=$('#c_reenv');if(cre)cre.onclick=()=>Store.reenviar();
  const co=$('#c_out');if(co)co.onclick=()=>Store.logout();
  const salvaJ=(id,v)=>{Cesta.set(Cesta.get().map(x=>x.id===id?{...x,just:v.trim()}:x));};
  document.querySelectorAll('[data-mj]').forEach(e=>e.onchange=()=>{salvaJ(e.dataset.mj,e.value);draw();});
  document.querySelectorAll('[data-rj]').forEach(e=>e.onchange=()=>{const it=Cesta.get().find(x=>x.ch==='dest|'+e.dataset.rj);if(it){salvaJ(it.id,e.value);e.classList.toggle('falta',e.value.trim().length<JUST_MIN);}});
  document.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{const row=b.closest('td'),inp=row&&row.querySelector('[data-rj]');if(inp){const it=Cesta.get().find(x=>x.ch==='dest|'+inp.dataset.rj);if(it)salvaJ(it.id,inp.value);}
    const it=Cesta.get().find(x=>x.ch==='dest|'+b.dataset.rg);
    if(!it||!justOk(it)){toast('Escreva a justificativa (mínimo '+JUST_MIN+' caracteres) para gravar.');if(inp)inp.focus();return;}
    draw();toast('Revisão do DFD '+it.ref+' gravada. Quando terminar, clique em Enviar revisão à coordenação.');});
  const re=$('#rv_env');if(re)re.onclick=()=>{const C=Cesta.get();if(!C.length)return;const sj=C.filter(x=>!justOk(x)).length;
    if(!identOk(ident())){exigeLogin();}
    else if(sj){S.tab='minhas';S.msg=sj+' revisão(ões) sem justificativa: complete antes de enviar.';window.scrollTo(0,0);draw();}
    else{window.scrollTo(0,0);enviarCesta();}};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{Cesta.set(Cesta.get().filter(x=>x.id!==b.dataset.rm));draw();});
  const me_=$('#mi_env');if(me_)me_.onclick=()=>{enviarCesta();};
  ['fsev','freg','fst','pst','fdest'].forEach(k=>{const e=$('#'+k);if(e)e.onchange=()=>{S[k]=e.value;draw();};});
  const q=$('#q');if(q)q.oninput=()=>{S.q=q.value;clearTimeout(window._t);window._t=setTimeout(()=>{draw();const n=$('#q');n.focus();n.setSelectionRange(99,99);},250);};
  document.querySelectorAll('[data-up]').forEach(i=>i.onchange=()=>i.files[0]&&onFile(i.files[0],+i.dataset.up));
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const [cid,r]=b.dataset.act.split('|');treat(cid,r);});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>edit(b.dataset.ed));
  document.querySelectorAll('[data-dest]').forEach(s=>s.onchange=()=>{const c=allCs().find(x=>x.id==s.dataset.dest);if(c)setDest(c,s.value);});
  document.querySelectorAll('[data-vc]').forEach(b=>b.onclick=()=>decideVinc(b.dataset.vc,true));
  document.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>decideVinc(b.dataset.vd,false));
  const e=$('#exp');if(e)e.onclick=()=>save('PCA_'+S.ano+'_adequado.csv',Core.exportCSV(cur(),ovF(),c=>{const k=destOf(c);return k!='cancelar'&&k!='proximo'&&k!='outros';}));
  const en=$('#expn');if(en)en.onclick=()=>save('PCA_'+S.ano+'_itens_para_'+(S.ano+1)+'.csv',Core.exportCSV(cur(),ovF(),c=>destOf(c)=='proximo'));
  const r=$('#expr');if(r)r.onclick=()=>save('Apontamentos_PCA_'+S.ano+'.csv','\uFEFFContratação;Regra;Descrição;Detalhe;Gravidade;Situação;Observação\r\n'+vals().map(a=>[a.num,a.regra,a.desc,a.det,a.sev,ST[stOf(a)],(S.aj[ajId(a.cid,a.regra)]||{}).obs||''].map(x=>String(x).replace(/;/g,',')).join(';')).join('\r\n'));
}
async function save(name,data){const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function treat(cid,r){
  const a=allVals().find(x=>x.cid==cid&&x.regra==r),cur0=S.aj[ajId(cid,r)]||{};const dlg=$('#dlg');
  dlg.innerHTML=`<h3>${esc(a.num)} · ${r}</h3><p>${esc(a.desc)}<br><span class="sub">${esc(a.det)}</span></p><label>Situação</label><select id="d1">${Object.keys(ST).map(k=>`<option value="${k}" ${(cur0.status||'pendente')==k?'selected':''}>${ST[k]}</option>`).join('')}</select><label>Observação / justificativa</label><textarea id="d2" rows="3">${esc(cur0.obs||'')}</textarea><div class="row" style="margin-top:12px"><button class="p" id="d3">Salvar</button><button class="s" id="d4">Cancelar</button></div>`;
  dlg.showModal();$('#d4').onclick=()=>dlg.close();$('#d3').onclick=()=>{setStatus(cid,r,$('#d1').value,$('#d2').value);dlg.close();};
}
function edit(cid){
  const c=allCs().find(x=>x.id==cid),o=(S.ov[cid]||{}).f||{};const F=[['titulo','Título'],['ini','Início (dd/mm/aaaa)'],['fim','Conclusão (dd/mm/aaaa)'],['prazo','Prazo (dias)'],['area','Área requisitante'],['prioridade','Prioridade']];
  const dlg=$('#dlg');dlg.innerHTML=`<h3>Adequar ${esc(c.num)}</h3><p class="sub">Original → o valor editado entra no CSV exportado.</p><label>Número do DFD <span class="sub">(não editável)</span></label><input value="${esc(c.num)}" disabled>`+F.map(f=>`<label>${f[1]} <span class="sub">(original: ${esc(c[f[0]])})</span></label><input data-f="${f[0]}" value="${esc(o[f[0]]??c[f[0]])}">`).join('')+`<div class="row" style="margin-top:12px"><button class="p" id="d3">Salvar</button><button class="s" id="d4">Cancelar</button></div>`;
  dlg.showModal();$('#d4').onclick=()=>dlg.close();
  $('#d3').onclick=()=>{const f={};dlg.querySelectorAll('[data-f]').forEach(i=>{if(i.value.trim()!==c[i.dataset.f])f[i.dataset.f]=i.value.trim();});
    if(f.fim&&!Core.pdate(f.fim)){S.msg='Data de conclusão inválida.';dlg.close();draw();return;}if(f.ini&&!Core.pdate(f.ini)){S.msg='Data de início inválida.';dlg.close();draw();return;}
    dlg.close();if(!Object.keys(f).length){return;}saveOv(cid,f);};
}
init();
</script>
</html>
